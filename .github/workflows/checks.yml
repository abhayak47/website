name: Site checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Layout partials are in sync
        run: |
          python tools/sync_layout.py
          git diff --exit-code -- . ':!sitemap.xml' || (echo "Run python tools/sync_layout.py and commit the result" && exit 1)
      - name: Links, structured data, SEO tags, sitemap
        run: python tools/check_site.py

  lighthouse:
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
